[project]
name = "todocargo"
version = "0.1.0"
description = "Prototipo de compras mayoristas de frutas con gestión de carga vehicular"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<6",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.3.9",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["tests.py", "test_*.py"]
addopts = "--reuse-db"
# WhiteNoise avisa si no existe staticfiles/ (solo se crea con collectstatic al desplegar).
filterwarnings = ["ignore:No directory at:UserWarning"]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]
